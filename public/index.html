<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08090c">
<title>Temple of Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37;--gold2:#f0c040;--gold3:#b8941f;
  --bg:#050608;--bg2:#0d0f13;--bg3:#141820;--bd:#1e2229;
  --txt:#f5f6f8;--mut:#8a9099;--grn:#22c55e;--red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%,rgba(212,175,55,.15),transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 100%,rgba(212,175,55,.06),transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(5,6,8,.85);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);
  padding:16px 0;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  display:flex;align-items:center;justify-content:center;
  font-size:24px;box-shadow:0 8px 24px rgba(212,175,55,.35);
  position:relative;
}
.logo-icon::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 50%);
}
.logo-text h1{
  font-size:17px;font-weight:900;letter-spacing:-.3px;
  background:linear-gradient(135deg,#fff,var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.2;
}
.logo-text .sub{
  font-size:10px;color:var(--mut);letter-spacing:2px;
  text-transform:uppercase;font-weight:600;margin-top:2px;
}
.badge-live{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.25);
  font-size:11px;font-weight:700;color:var(--grn);
  text-transform:uppercase;letter-spacing:1px;
}
.badge-live .dot{
  width:6px;height:6px;border-radius:50%;background:var(--grn);
  box-shadow:0 0 8px var(--grn);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== HERO ===== */
.hero{
  text-align:center;padding:50px 20px 30px;
  position:relative;
}
.hero h2{
  font-size:clamp(28px,6vw,44px);font-weight:900;
  letter-spacing:-1px;line-height:1.1;margin-bottom:12px;
  background:linear-gradient(135deg,#fff 0%,var(--gold2) 50%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{
  color:var(--mut);font-size:14px;font-weight:500;
  max-width:500px;margin:0 auto;line-height:1.6;
}
.hero .shine{
  display:inline-block;
  background:linear-gradient(90deg,var(--gold) 0%,#fff 50%,var(--gold) 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center}}

/* ===== SEÇÃO TÍTULO ===== */
.section-title{
  display:flex;align-items:center;gap:12px;
  margin:40px 0 20px;
}
.section-title .bar{
  width:4px;height:24px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold),var(--gold3));
}
.section-title h3{
  font-size:18px;font-weight:800;letter-spacing:-.3px;
}
.section-title .count{
  margin-left:auto;font-size:12px;color:var(--mut);
  font-weight:600;
}

/* ===== GRID JOGOS ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:16px;
  margin-bottom:60px;
}
.jogo{
  background:var(--bg2);
  border:1px solid var(--bd);
  border-radius:16px;
  overflow:hidden;
  text-decoration:none;color:inherit;
  display:block;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  position:relative;
}
.jogo:hover,.jogo:active{
  transform:translateY(-6px) scale(1.02);
  border-color:var(--gold);
  box-shadow:0 20px 40px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,.3),0 0 30px rgba(212,175,55,.15);
}
.jogo-img{
  position:relative;width:100%;aspect-ratio:1/1;
  overflow:hidden;background:#000;
}
.jogo-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  display:block;
}
.jogo:hover .jogo-img img{transform:scale(1.1)}
.jogo-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.9) 100%);
  pointer-events:none;
}
.jogo-nome{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 12px 12px;
  font-size:13px;font-weight:700;line-height:1.3;
  color:#fff;z-index:2;
  text-shadow:0 2px 8px rgba(0,0,0,.8);
}
.jogo-tag{
  position:absolute;top:10px;right:10px;z-index:3;
  padding:4px 10px;border-radius:20px;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  color:#000;font-size:9px;font-weight:900;
  letter-spacing:.8px;text-transform:uppercase;
  box-shadow:0 4px 12px rgba(212,175,55,.4);
}
.jogo.vip{
  border-color:rgba(212,175,55,.4);
  background:linear-gradient(135deg,var(--bg2),#1a1408);
}
.jogo.vip .jogo-nome{color:var(--gold2)}

/* ===== FOOTER ===== */
footer{
  border-top:1px solid var(--bd);
  padding:30px 20px;text-align:center;
  color:var(--mut);font-size:11px;
  letter-spacing:1px;text-transform:uppercase;
  font-weight:600;
}
footer .gold{color:var(--gold)}

/* ===== SKELETON ===== */
.skel{
  background:linear-gradient(90deg,var(--bg2) 0%,var(--bg3) 50%,var(--bg2) 100%);
  background-size:200% 100%;
  animation:skel 1.5s infinite;
  border-radius:16px;
  aspect-ratio:1/1;
}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== MOBILE ===== */
@media(max-width:600px){
  .wrap{padding:0 14px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .jogo-nome{font-size:12px;padding:10px}
  .badge-live span.txt{display:none}
  .badge-live{padding:8px 10px}
  .hero{padding:30px 10px 20px}
}
</style>
</head>
<body>

<header>
<div class="wrap header-inner">
  <a href="/" class="logo">
    <div class="logo-icon" id="logoIcon">🎰</div>
    <div class="logo-text">
      <h1 id="logoNome">Temple of Games</h1>
      <div class="sub" id="logoSub">Cassino Online</div>
    </div>
  </a>
  <div class="badge-live">
    <div class="dot"></div>
    <span class="txt">Online</span>
  </div>
</div>
</header>

<section class="hero">
  <h2>Jogue os melhores <span class="shine">slots</span> do mundo</h2>
  <p id="heroSub">Os maiores títulos das produtoras premium, disponíveis 24 horas por dia.</p>
</section>

<div class="wrap">
  <div class="section-title">
    <div class="bar"></div>
    <h3>🎮 Jogos Disponíveis</h3>
    <span class="count" id="count">Carregando...</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  <p>Temple of Games &copy; <span class="gold" id="ano"></span> — Todos os direitos reservados</p>
</footer>

<script>
// ano
document.getElementById('ano').textContent = new Date().getFullYear();

// skeleton inicial
const grid = document.getElementById('grid');
for(let i=0;i<8;i++){
  const s = document.createElement('div');
  s.className='skel';
  grid.appendChild(s);
}

fetch('/api/config')
  .then(r => r.json())
  .then(cfg => {
    // logo
    if(cfg.empresa){
      document.getElementById('logoIcon').textContent = cfg.empresa.logo_emoji || '🎰';
      document.getElementById('logoNome').textContent = cfg.empresa.nome || 'Temple of Games';
    }
    if(cfg.banner){
      document.getElementById('heroSub').textContent = cfg.banner;
    }
    // grid
    const jogos = cfg.jogos || [];
    document.getElementById('count').textContent = jogos.length + ' títulos';
    grid.innerHTML = '';
    jogos.forEach((j, i) => {
      const a = document.createElement('a');
      a.className = 'jogo' + (j.vip ? ' vip' : '');
      a.href = j.link || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.animation = 'fadeUp .5s cubic-bezier(.2,.8,.2,1) ' + (i*0.05) + 's both';
      a.innerHTML =
        '<div class="jogo-img">' +
          (j.imagem ? '<img src="'+j.imagem+'" alt="'+j.nome+'" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
          (j.vip ? '<div class="jogo-tag">VIP</div>' : '') +
          '<div class="jogo-nome">'+j.nome+'</div>' +
        '</div>';
      grid.appendChild(a);
    });
  })
  .catch(err => {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--mut);padding:40px">Erro ao carregar jogos.</p>';
  });

// animação fade
const style = document.createElement('style');
style.textContent = '@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}';
document.head.appendChild(style);
</script>
</body>
</html>
